# @deepseek-ai/dsh-hub-server bundle patch: mounts the hub server plugin on a
# DeepSeek Harness instance, exposing local sessions over WebSocket JSON-RPC.
# Applied as a bundle layer when the package is installed via `dsh plugin add`.
#
# The disabled row defaults to loopback and still requires an explicit token for
# any deployment that enables a non-loopback listener.
# so the row is disabled by default — the user enables it and supplies an
# auth token before starting.

- insert:
    - id: hub-server
      name: '@deepseek-ai/dsh-hub-server'
      disabled: true
      config:
        endpointId: remote:local-hub
        port: 8765
        host: '127.0.0.1'
        authTokens: []
        serverName: deepseek-harness-hub
